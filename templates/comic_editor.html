<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Editor - Drag & Edit</title>
    <style>
        html, body { 
            height: 100%; 
        }
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        .header { display: none; }
        
        .header h1 {
            margin: 0;
            font-size: 28px;
        }
        
        .header p {
            margin: 10px 0 0 0;
            opacity: 0.8;
        }
        
        #comic-editor {
            width: 100vw;
            height: 100vh;
            padding: 0;
        }
        
        .loading {
            text-align: center;
            color: white;
            padding: 50px;
            font-size: 20px;
        }

        /* ✅ FIX for gaps between comic panels/images */
        .panel-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 0;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        .panel {
            margin: 0;
            padding: 0;
            border: none;
            width: 100%;
            height: 100%;
        }

        .panel img {
            display: block;     /* removes inline spacing */
            width: 100%;
            height: 100%;
            object-fit: cover;  /* keeps proportions, may crop */
            /* use object-fit: fill if you prefer no gaps at all but stretched */
        }
        
        /* Mobile responsive */
        @media (max-width: 768px) {
            .editor-toolbar {
                position: static !important;
                margin: 20px;
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
            }
            
            .toolbar-btn {
                width: auto !important;
                padding: 8px 15px !important;
                margin: 5px !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎨 Interactive Comic Editor</h1>
        <p>Drag bubbles to reposition • Double-click to edit text • Add new bubbles anytime</p>
    </div>
    
    <div id="comic-editor">
        <div class="loading">Loading comic...</div>
    </div>
    
    <script src="/static/comic_editor.js"></script>
</body>
</html>
