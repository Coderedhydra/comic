<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Comic Layout (2x2, Message Strips)</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; margin: 0; }
      header { padding: 12px 16px; border-bottom: 1px solid #e5e7eb; display: flex; gap: 12px; align-items: center; }
      main { display: grid; grid-template-columns: 280px 1fr; gap: 12px; height: calc(100vh - 53px); }
      aside { border-right: 1px solid #e5e7eb; padding: 12px; overflow: auto; }
      section { padding: 12px; overflow: auto; }
      button, input[type="file"] { padding: 8px 12px; border: 1px solid #cbd5e1; background: white; border-radius: 6px; cursor: pointer; }
      .canvas-wrap { width: 400px; height: 540px; border: 1px solid #cbd5e1; position: relative; background: #f8fafc; }
      .grid { position: absolute; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
      .cell { border: 1px solid #e2e8f0; overflow: hidden; position: relative; background: #fff; }
      .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .bubble { position: absolute; background: #111827; color: white; padding: 6px 8px; border-radius: 2px; cursor: move; user-select: none; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
      .bubble[contenteditable="true"] { outline: 2px solid #6366f1; cursor: text; }
      .toolbar { display: flex; gap: 8px; align-items: center; }
      .list { display: grid; gap: 6px; }
      .page-item { padding: 6px 8px; border: 1px solid #e5e7eb; border-radius: 6px; background: #fff; display: flex; align-items: center; justify-content: space-between; }
      .small { color: #64748b; font-size: 12px; }
    </style>
  </head>
  <body>
    <header>
      <div class="toolbar">
        <input id="load-project" type="file" accept="application/json" />
        <button id="load-server">Load from Server</button>
        <button id="prev">Prev</button>
        <div id="page-indicator" class="small">Page 1/1</div>
        <button id="next">Next</button>
        <button id="add-bubble">Add Bubble</button>
        <button id="export-page">Export PNG (400x540)</button>
        <button id="export-all">Export All (ZIP)</button>
      </div>
    </header>
    <main>
      <aside>
        <div class="list" id="thumbs"></div>
      </aside>
      <section>
        <div class="canvas-wrap" id="canvas" data-w="400" data-h="540">
          <div class="grid">
            <div class="cell"><img id="img-0" /></div>
            <div class="cell"><img id="img-1" /></div>
            <div class="cell"><img id="img-2" /></div>
            <div class="cell"><img id="img-3" /></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/main.js"></script>
  </body>
  </html>
