<!DOCTYPE html>

    <title>Test 800x540 6 Pages Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        
        .comic-container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .comic-title { 
            text-align: center; 
            padding: 20px; 
            background: #333; 
            color: white; 
            font-size: 24px;
            font-weight: bold;
        }
        
        .comic-page { 
            width: 800px;
            height: 1080px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 800px;
            grid-template-rows: 540px 540px;
            gap: 0;
            border: 3px solid #333;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        .panel { 
            position: relative;
            overflow: hidden;
            background: #fff;
            width: 800px;
            height: 540px;
            margin: 0;
            padding: 0;
            border: none;
            box-sizing: border-box;
        }
        
        .panel img { 
            width: 800px; 
            height: 540px; 
            object-fit: none;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        .speech-bubble { 
            position: absolute; 
            background: white; 
            border: 2px solid #333; 
            border-radius: 15px; 
            padding: 10px; 
            font-size: 14px; 
            max-width: 200px; 
            word-wrap: break-word;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }
        
        .page-number {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>
