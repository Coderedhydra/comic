    <title>Improved Comic - Enhanced Colors & Draggable Bubbles</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        
        .comic-container { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .comic-title { 
            text-align: center; 
            padding: 20px; 
            background: #333; 
            color: white; 
            font-size: 24px;
            font-weight: bold;
        }
        
        .comic-page { 
            width: 800px;
            height: 1080px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 800px;
            grid-template-rows: 540px 540px;
            gap: 0;
            border: 3px solid #333;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        
        .panel { 
            position: relative;
            overflow: hidden;
            background: #fff;
            width: 800px;
            height: 540px;
            margin: 0;
            padding: 0;
            border: none;
            box-sizing: border-box;
        }
        
        .panel img { 
            width: 800px; 
            height: 540px; 
            object-fit: none;
            display: block;
            margin: 0;
            padding: 0;
            border: none;
        }
        
        .speech-bubble { 
            position: absolute; 
            background: white; 
            border: 2px solid #333; 
            border-radius: 20px; 
            padding: 12px 24px; 
            width: 180px; 
            height: 60px; 
            font-size: 14px; 
            font-weight: bold;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.4);
            z-index: 10;
            text-align: center;
            color: #333;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            pointer-events: auto;
        }
        
        .speech-bubble:hover { 
            transform: scale(1.02); 
            box-shadow: 4px 4px 12px rgba(0,0,0,0.5); 
            background: #f8f8f8;
        }
        
        .speech-bubble::after { 
            content: ''; 
            position: absolute; 
            bottom: -12px; 
            left: 30px; 
            width: 0; 
            height: 0; 
            border-left: 12px solid transparent; 
            border-right: 12px solid transparent; 
            border-top: 12px solid #333; 
        }
        
        .speech-bubble::before { 
            content: ''; 
            position: absolute; 
            bottom: -10px; 
            left: 32px; 
            width: 0; 
            height: 0; 
            border-left: 10px solid transparent; 
            border-right: 10px solid transparent; 
            border-top: 10px solid white; 
        }
        
        .page-number {
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
    </style>
</head>

    <script>
        // Dragging functionality for speech bubbles
        function makeDraggable(element) {
            let isDragging = false;
            let currentX;
            let currentY;
            let initialX;
            let initialY;
            let xOffset = 0;
            let yOffset = 0;
            
            element.addEventListener('mousedown', dragStart);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', dragEnd);
            
            function dragStart(e) {
                if (e.target === element || element.contains(e.target)) {
                    initialX = e.clientX - xOffset;
                    initialY = e.clientY - yOffset;
                    
                    if (e.target === element || element.contains(e.target)) {
                        isDragging = true;
                        element.style.cursor = 'grabbing';
                        element.style.zIndex = '1000';
                    }
                }
            }
            
            function drag(e) {
                if (isDragging) {
                    e.preventDefault();
                    currentX = e.clientX - initialX;
                    currentY = e.clientY - initialY;
                    
                    xOffset = currentX;
                    yOffset = currentY;
                    
                    element.style.transform = `translate(${currentX}px, ${currentY}px)`;
                }
            }
            
            function dragEnd(e) {
                initialX = currentX;
                initialY = currentY;
                isDragging = false;
                element.style.cursor = 'move';
                element.style.zIndex = '10';
            }
        }
        
        // Make all bubbles draggable
        document.addEventListener('DOMContentLoaded', function() {
            const bubbles = document.querySelectorAll('.speech-bubble');
            bubbles.forEach(makeDraggable);
        });
    </script>
